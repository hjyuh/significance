digestions:
  - audience: general_mathematician
    kind: plain_language
    stratum: editor
    text: >-
      Problem 726 asks for a pointwise asymptotic over primes. The manuscript
      separates the task into an unproved prime-distribution input and an
      elementary harmonic-analysis deduction. Its claimed deduction is useful
      only conditionally: the central hypothesis extends known control of the
      phases N/p from a subexponential range to |N| <= exp(P^c), far enough to
      reach polylogarithmic prime scales.
    basis: digest
    asserted_by: significance-editor
    source_claims: [claim-main]

importance_claims:
  - text: >-
      The manuscript describes Hypothesis 3.1 as the concrete missing input and
      says the cited currently proved range does not reach the scales needed
      for the conjecture.
    basis: editorial_inference
    asserted_by: significance-editor
    source:
      page: 11
      url: "https://zenodo.org/records/21882603"
      quote: >-
        The conditional theorem above therefore identifies a concrete target
        for future analytic work.

open_invitations:
  - kind: focused_check
    target: >-
      Verify the deduction from Hypothesis 3.1 to Theorem 1.1, especially the
      dyadic replacement in Proposition 5.1 and summation in Corollary 5.2.
    how: >-
      Work from the PDF hash recorded here. Check the smoothing errors,
      uniformity in the dyadic interval, and the accumulation of errors over
      prime scales. Report the first unsupported step or the bounded portion
      checked; do not assess the unproved hypothesis itself in this task.
    respond:
      url: "https://github.com/hjyuh/significance/issues/new?template=invitation-response.yml"
    created_by: significance-editor
    created_at: "2026-08-12T22:27:07Z"
  - kind: hypothesis_comparison
    target: >-
      Compare Hypothesis 3.1 precisely with the cited one-dimensional case of
      Matomaki-Radziwill-Shao-Tao-Teravainen Proposition 1.12(ii).
    how: >-
      Tabulate the quantifiers, test-function norm, interval uniformity, error
      term, and allowed N range in both statements. Separate what the cited
      paper proves from what it presents as a heuristic extension.
    respond:
      url: "https://github.com/hjyuh/significance/issues/new?template=invitation-response.yml"
    created_by: significance-editor
    created_at: "2026-08-12T22:27:07Z"
  - kind: calculation_check
    target: >-
      Check the elementary decomposition of S(n), including the floor identity,
      small-prime contribution, and cancellation of the continuous integral.
    how: >-
      Check equations (6)-(12), Lemma 6.1, and the assembly in Section 7.
      Identify which steps are unconditional and which import Hypothesis 3.1.
    respond:
      url: "https://github.com/hjyuh/significance/issues/new?template=invitation-response.yml"
    created_by: significance-editor
    created_at: "2026-08-12T22:27:07Z"

