claim:
  id: claim-main
  display_math: >-
    \mathrm{RPE}\Longrightarrow
    S(n)=\frac12\log\,\log n+O(\log\,\log\,\log n).
  text:
    value: >-
      Assume Hypothesis 3.1. Then, as n → ∞ through the positive integers,
      S(n) = 1/2 log log n + O(log log log n).
    basis: source_quote
    asserted_by: rafik-zeraoulia
    asserted_at: "2026-08-11T05:10:13Z"
    locator:
      page: 3
      url: "https://zenodo.org/records/21882603"
      quote: >-
        Assume Hypothesis 3.1. Then, as n → ∞ through the positive integers,
        S(n) = 1/2 log log n + O(log log log n).
  scope:
    value: >-
      The result is conditional on the manuscript's Reciprocal-Prime
      Equidistribution Hypothesis 3.1, which requires smooth equidistribution
      for |N| <= exp(P^c). The manuscript says that this hypothesis is not
      presently known and is stronger in range than the cited theorem.
    basis: editorial_inference
    asserted_by: significance-editor
    asserted_at: "2026-08-12T22:27:07Z"
    locator:
      page: 3
      url: "https://zenodo.org/records/21882603"
      quote: >-
        Hypothesis 3.1 is not presently known, and the result should not be
        interpreted as an unconditional solution.
  exclusions:
    - value: "No unconditional resolution is claimed."
      basis: source_quote
      asserted_by: rafik-zeraoulia
      asserted_at: "2026-08-11T05:10:13Z"
      locator:
        page: 1
        url: "https://zenodo.org/records/21882603"
        quote: "No unconditional resolution is claimed."

