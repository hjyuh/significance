claim:
  id: claim-main
  display_math: >-
    g(n)\le n-1-c_\alpha n^{(6-\alpha)/(8-3\alpha)}.
  text:
    value: >-
      For every fixed α with 0 < α < 1/e, there are constants cα > 0 and
      n₀(α) such that, for n ≥ n₀(α), g(n) ≤ n − 1 − cα n^β(α), where
      β(α) = (6 − α)/(8 − 3α).
    basis: source_quote
    asserted_by: rafik-zeraoulia
    asserted_at: "2026-08-09T07:39:13Z"
    locator:
      page: 2
      url: "https://zenodo.org/records/21858673"
      quote: >-
        For every fixed α with 0 < α < 1/e, there are constants cα > 0 and
        n₀(α) such that, for n ≥ n₀(α), g(n) ≤ n − 1 − cα n^β(α),
        β(α) = (6 − α)/(8 − 3α).
  scope:
    value: >-
      This is a quantitative partial result for Erdős Problem 653. Its endpoint
      consequence gives a defect exponent arbitrarily close to
      (6e - 1)/(8e - 3) = 0.8166799862..., compared with the previously quoted
      exponent 2/3. It does not establish g(n) >= (1 - o(1))n.
    basis: editorial_inference
    asserted_by: significance-editor
    asserted_at: "2026-08-12T22:27:07Z"
    locator:
      page: 2
      url: "https://zenodo.org/records/21858673"
      quote: >-
        This does not decide (1.1), because n^theta = o(n). It does, however,
        strengthen the exponent 2/3 in the classical upper defect.
  exclusions:
    - value: "The original asymptotic problem remains open."
      basis: source_quote
      asserted_by: rafik-zeraoulia
      asserted_at: "2026-08-09T07:39:13Z"
      locator:
        page: 1
        url: "https://zenodo.org/records/21858673"
        quote: "The original asymptotic problem remains open."

