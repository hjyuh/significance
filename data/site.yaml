# Site-level configuration for the Python-rendered pages.
#
# Deliberately tiny, and deliberately not derived from the request: a page
# built here is served from wherever it is served from, and a value read out of
# a Host header would let whoever set that header decide where a "contact us"
# link points.
#
# `contact_email` ships unset. Nothing in this repository records a maintainer
# address, and inventing one would produce a mailto link that silently goes
# nowhere -- worse than no link, because a person who used it would believe
# they had asked. While it carries the [FILL] marker the renderer omits the
# mailto action and shows the same message as copyable text instead, saying
# plainly that the address is not configured yet.

repository_url: "https://github.com/hjyuh/significance"

# Who answers for this site, shown on /about/. Ships unset for the same reason
# contact_email does: a site that will not say whose judgement is behind its
# editorial entries has not earned the reader's, and a placeholder name printed
# as if it were real is worse than an admission that nobody has filled this in.
# While it carries the [FILL] marker, /about/ says the maintainer is not named
# yet rather than printing the bracket text.
maintainer_name: "[FILL: the name that answers for this site]"

# The GitHub issue form at .github/ISSUE_TEMPLATE/record-request.yml. Kept as a
# separate key rather than built by string-concatenation in a template, so that
# moving or renaming the template is one edit in one place.
record_request_template: "record-request.yml"

contact_email: "[FILL: maintainer address, or leave as-is to omit the mailto link]"

# The site's own public address, used only to build the link inside a
# copy-status paragraph. Unset (or left as a [FILL] marker) means the paragraph
# is rendered without a link rather than with a guessed one: a paste carrying a
# wrong URL is worse than a paste carrying none, because the reader who follows
# it blames themselves. It is never derived from a request -- see the header of
# db/config.ts on the other half of this project for the same rule and the
# attack behind it.
site_url: "https://hjyuh.github.io/significance/"

# Shown on /request/ when set. Deliberately unset by default: a turnaround
# printed on a page and missed is worse than no turnaround at all, so this
# says a number only when somebody is prepared to keep it.
request_turnaround: "a few days"

# Backlog remains hidden until the corpus is large enough to make it useful.
backlog_enabled: true
backlog_min_records: 5
stale_task_days: 45
