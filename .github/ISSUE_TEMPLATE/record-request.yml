name: Request or correct a record
description: Suggest a mathematical claim for a new record or correct an existing page.
title: "Record request: "
labels: ["record-request"]
body:
  - type: markdown
    attributes:
      value: |
        A record tracks what was claimed, what evidence exists, and what
        remains open. It does not say whether the mathematics is right, and
        nothing in it will.

        **This issue and its comments are public.** Do not include private
        correspondence or personal information. One issue should cover one
        claim or one focused correction. No YAML or Significance account is needed.

        Widely circulating public claims from organisations or major announcements
        may receive editorial records based on public sources. Ordinary claims
        by individual living authors require an author request or explicit opt-in
        before publication. A reader's suggestion is not permission to publish.
        No decline list is kept.

        A maintainer checks sources, asks follow-up questions here, and prepares
        any proposed record or correction through a pull request, validation,
        and human review. Nothing is published automatically from this issue.

  - type: input
    id: claim-link
    attributes:
      label: Link to the claim or Significance record
      description: >-
        For a new record, link the paper, preprint, repository, announcement,
        or post. For a correction, link the existing Significance page.
      placeholder: https://arxiv.org/abs/...
    validations:
      required: true

  - type: dropdown
    id: role
    attributes:
      label: Your role
      description: >-
        Asked because it changes what happens next, not to rank the request.
        This gives maintainers context for the publication rules above.
      options:
        - I am an author of this claim
        - I am a reader with no involvement
        - Other (explain below)
    validations:
      required: true

  - type: textarea
    id: what-tracked
    attributes:
      label: What should be added or corrected? (optional)
      description: >-
        In your own words. Useful things to say: which specific statement
        matters, what evidence already exists, what you think nobody has
        checked yet. For a correction, identify the section or sentence,
        suggest the change, and link supporting sources. Plain language is
        fine; leave this blank if you are not sure.
      placeholder: |
        The statement I care about is Theorem 3.2. There is a Lean
        formalization at <link>, but I do not think anyone has checked whether
        it proves the same thing the paper states.
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        Filing this does not commit anyone to creating a record, and a request
        that goes nowhere is closed without a public judgement attached to it.
