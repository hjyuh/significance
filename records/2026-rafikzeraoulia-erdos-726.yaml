open_invitations:
  - kind: hypothesis_scope
    target: "Check Hypothesis 3.1 and Remark 3.2 against the cited literature."
    how: >-
      Use the exact PDF in manuscript.url. Compare the interval, exp(P^c)
      range, C^3 norm, and error term with the cited Matomaki--Radziwill--
      Shao--Tao--Teravainen result. Record whether the paper labels its
      hypothesis as conjectural and does not present the citation as a proof
      of it; this is a source-and-scope check, not a proof verdict.
    respond:
      url: "https://github.com/hjyuh/significance/issues/new?template=invitation-response.yml"
    created_by: significance-editor
    created_at: "2026-08-16T15:19:21Z"
  - kind: weighted_reduction
    target: "Check Lemma 3.3, Proposition 5.1, and Corollary 5.2."
    how: >-
      Check the partial-summation step, the smooth approximation and boundary
      error, and the parameter ranges used to pass from dyadic blocks to the
      intermediate scales. Record the first gap or the bounded steps followed;
      do not rate the rest of the manuscript.
    respond:
      url: "https://github.com/hjyuh/significance/issues/new?template=invitation-response.yml"
    created_by: significance-editor
    created_at: "2026-08-16T15:19:21Z"
  - kind: main_cancellation
    target: "Check Lemma 6.1 and the decomposition used in the proof of Theorem 1.1."
    how: >-
      Follow the split at the polylogarithmic cutoff Y for small,
      intermediate, and large primes. Check how Lemma 6.1 supplies the
      cancellation and whether the three errors combine to O(log log log n).
      Report only the passages read, not a whole-paper conclusion.
    respond:
      url: "https://github.com/hjyuh/significance/issues/new?template=invitation-response.yml"
    created_by: significance-editor
    created_at: "2026-08-16T15:19:21Z"
  - kind: alternate_hypothesis
    target: "Optionally check Hypothesis 8.1 and Proposition 8.2."
    how: >-
      Verify that the exponential-sum hypothesis has the stated frequency
      range and norms, and that the argument really implies Hypothesis 3.1.
      Treat the result as a separate bounded implication; it does not make
      the hypothesis known.
    respond:
      url: "https://github.com/hjyuh/significance/issues/new?template=invitation-response.yml"
    created_by: significance-editor
    created_at: "2026-08-16T15:19:21Z"

