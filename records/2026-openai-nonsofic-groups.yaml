open_invitations:
  - kind: reproduction
    target: "Reproduce NonSoficGroup at commit c510a55434c0935cde446e5a372699a4671438f6 under Lean 4.32.0 and run its Comparator/Nanoda challenge."
    how: >-
      Clone https://github.com/openai/ten-proofs and check out
      c510a55434c0935cde446e5a372699a4671438f6. Build under Lean 4.32.0; this
      record's own run pinned its toolchain by digest
      sha256:e18db1519e04134512c50930c1ea4d4c9b339b37f4939e287b4e22dd752624a6,
      so a run that wants to be comparable pins the same one. Then run the
      Comparator challenge at ComparatorChallenges/D_NonSoficGroup.json.
      Report the sha256 of your build log and whether the axiom closure stayed
      inside propext, Classical.choice and Quot.sound. A build that fails is a
      result worth reporting, not a wasted afternoon.
    respond:
      url: "https://github.com/hjyuh/significance/issues/new?template=invitation-response.yml"
    created_by: significance-editor
    created_at: "2026-08-01T13:57:00Z"
  - kind: correspondence
    target: "Trace the declaration chain between manuscript Theorem 1.1 and the Comparator target exists_finitelyPresented_nonsofic_group."
    how: >-
      Read Theorem 1.1 on page 78 of the manuscript hashed in this record
      (sha256 f318c6508c9d49ef876a5a26cd73928705f96c07bb43e92a0cb35bd3f666ea53),
      then read
      SoficGroups.SourceTopLevelCompressionFinal.exists_finitelyPresented_nonsofic_group,
      the declaration ComparatorChallenges/D_NonSoficGroup.json names at the
      pinned commit. Walk the declarations between them and write down each
      one. The specific thing to look for: the manuscript states a property of
      one concrete group, the formal target states that some finitely
      presented group exists. Say where those two part company, and whether
      anything in between closes the gap.
    respond:
      url: "https://github.com/hjyuh/significance/issues/new?template=invitation-response.yml"
    created_by: significance-editor
    created_at: "2026-08-01T13:57:00Z"
  - kind: mathematical_review
    target: "Assess the expander-matching criterion in Proposition 2.3 or the Thompson-group step in Proposition 3.2, naming the exact artifact revision reviewed."
    how: >-
      Pick one: the expander-matching criterion in Proposition 2.3, or the
      Thompson-group step in Proposition 3.2. Work from the manuscript hashed
      here (sha256
      f318c6508c9d49ef876a5a26cd73928705f96c07bb43e92a0cb35bd3f666ea53) and
      name that hash in what you write, so the assessment stays attached to the
      revision you actually read. "I could not follow step 4" is a useful
      report and will be recorded as what it is: your reading, signed by you.
    respond:
      url: "https://github.com/hjyuh/significance/issues/new?template=invitation-response.yml"
    created_by: significance-editor
    created_at: "2026-08-01T13:57:00Z"

