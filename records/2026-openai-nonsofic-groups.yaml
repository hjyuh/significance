claim:
  id: claim-main
  text:
    value: "The unit group L_F2(1,2)× of the binary Leavitt algebra is not sofic."
    basis: source_quote
    asserted_by: openai
    asserted_at: "2026-08-01T13:53:00Z"
    locator:
      page: 78
      quote: "Theorem 1.1. The unit group L_F2(1,2)× is not sofic."
  scope:
    value: "The manuscript identifies a concrete countable unit group; its public Comparator target separately states existence of a finitely presented non-sofic group."
    basis: editorial_inference
    asserted_by: significance-editor
    asserted_at: "2026-08-01T13:57:00Z"
  exclusions:
    - value: "The manuscript says this result does not determine whether the unit group is hyperlinear."
      basis: source_quote
      asserted_by: openai
      asserted_at: "2026-08-01T13:53:00Z"
      locator:
        page: 80
        quote: "Theorem 1.1 does not determine whether L_F2(1,2)× is hyperlinear."

# A restatement of this record in plain words, for a reader who does not know
# what a "correspondence attestation" or an "axiom policy" is. Every sentence
# below points at something further down this file; none of it adds a fact.
plain_summary:
  claimed: >-
    OpenAI says one specific infinite group — the unit group of a small algebra
    built from two symbols — cannot be approximated by finite shuffles. That
    property is called soficity, and the manuscript states this group does not
    have it.
  checked: >-
    Significance rebuilt the published Lean code at a pinned commit and recorded
    that the build and the axiom check ran to completion, with both logs hashed.
    The manuscript file was downloaded and hashed. These are checks on
    artifacts, not on the mathematics.
  not_checked: >-
    Nobody has traced the manuscript's Theorem 1.1 to the statement the Lean
    code actually contains; the repository's formal target is a broader
    existence statement. No mathematician's assessment of the argument is
    recorded here. The three open invitations name this work.
  basis: digest
  asserted_by: significance-editor
  asserted_at: "2026-08-07T00:00:00Z"
  # A translation is a second summary with its own asserter. These were drafted
  # by the editor and must be read by somebody fluent before anyone leans on
  # them: the record puts a name against every sentence, including these.
  translations:
    - lang: fr
      claimed: >-
        OpenAI affirme qu'un groupe infini précis — le groupe des éléments
        inversibles d'une petite algèbre construite à partir de deux symboles —
        ne peut pas être approché par des permutations finies. Cette propriété
        s'appelle la soficité, et le manuscrit soutient que ce groupe ne la
        possède pas.
      checked: >-
        Significance a reconstruit le code Lean publié à un commit fixé et a
        enregistré que la compilation et la vérification des axiomes sont
        allées à leur terme, les deux journaux étant empreintés. Le fichier du
        manuscrit a été téléchargé et empreinté. Ce sont des vérifications
        portant sur des artefacts, pas sur les mathématiques.
      not_checked: >-
        Personne n'a établi le lien entre le théorème 1.1 du manuscrit et
        l'énoncé que contient réellement le code Lean ; la cible formelle du
        dépôt est un énoncé d'existence plus large. Aucune évaluation par un
        mathématicien n'est consignée ici. Les trois invitations ouvertes
        désignent ce travail.
      basis: digest
      asserted_by: significance-editor
      asserted_at: "2026-08-07T00:00:00Z"
    - lang: ar
      claimed: >-
        تؤكد OpenAI أن زمرة لا نهائية محددة — زمرة العناصر القابلة للعكس في
        جبر صغير مبني من رمزين — لا يمكن تقريبها بتباديل منتهية. تسمّى هذه
        الخاصية الصوفية، ويذهب المخطوط إلى أن هذه الزمرة لا تتمتع بها.
      checked: >-
        أعادت Significance بناء شيفرة Lean المنشورة عند إصدار مثبّت، وسجّلت أن
        عملية البناء وفحص البديهيات اكتملتا، مع بصمة رقمية لكلا السجلّين. كما
        جرى تنزيل ملف المخطوط وحساب بصمته. هذه فحوص على المصنوعات الرقمية لا
        على الرياضيات نفسها.
      not_checked: >-
        لم يتتبع أحد الصلة بين المبرهنة 1.1 في المخطوط والعبارة التي تتضمنها
        شيفرة Lean فعلياً؛ فالهدف الصوري في المستودع عبارة وجود أوسع. ولا
        يتضمن هذا السجل أي تقييم من رياضي. والدعوات المفتوحة الثلاث تشير إلى
        هذا العمل.
      basis: digest
      asserted_by: significance-editor
      asserted_at: "2026-08-07T00:00:00Z"

