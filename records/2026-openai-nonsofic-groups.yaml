digestions:
  - audience: non_specialist
    kind: plain_language
    stratum: editor
    text: >-
      A group here is a set of reversible operations you can undo and combine.
      Soficity asks whether an infinite group can be imitated, to any accuracy
      you like, by shuffling a finite deck of cards: every product you can form
      in the group is matched by a shuffle that agrees almost everywhere. Most
      groups anyone writes down can be imitated this way, and for decades
      nobody produced one that provably cannot. The manuscript names a
      candidate: the reversible elements of a small algebra built from two
      symbols. Its claim is that no finite shuffle imitates this group well
      enough. What Significance holds is the artifacts around that claim -- the
      manuscript file, the formal code, the logs of rebuilding it -- not a
      reading of the argument itself.
    basis: digest
    asserted_by: significance-editor
    source_claims: [claim-main]
  - audience: general_mathematician
    text: "The manuscript proposes an explicit boundary for finite-permutation approximation: a concrete group built from the binary Leavitt algebra that is claimed not to admit sofic approximations. The public Lean target records a related existential finite-presentation statement, so correspondence between the concrete and formal claims remains a useful, separate audit task."
    basis: editorial_inference
    asserted_by: significance-editor
    source_claims: [claim-main]

