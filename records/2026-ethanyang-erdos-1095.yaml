review_map:
  main_deduction:
    text: >-
      Modify L_k by adding small-prime factors and removing the top prime
      band, producing a modulus M with room for multipliers t. Lucas's
      criterion becomes forbidden residue conditions in three prime ranges.
      PNT bounds their density; truncated inclusion–exclusion with explicit
      CRT discrepancy produces a surviving t. Set n = Mt - 1 and use the
      least-witness definition to conclude the strict eventual lcm bound.
    location: Paper §§2–5; Erdos1095/Main.lean
    pointer: Check both witness inequalities and a single threshold for all sufficiently large k.
    basis: editorial_inference
    asserted_by: significance-editor
    asserted_at: '2026-10-01T13:17:58Z'
  risks:
  - text: >-
      The finite interval count must control the sum of CRT discrepancies
      over truncated intersections and the Bonferroni/factorial tail. Check
      that the chosen constants make the surviving main term exceed the error.
    location: Paper §4 finite sieve lemma and §5 surviving multiplier
    reason: The residue density alone does not place a witness in the required finite interval.
    basis: editorial_inference
    asserted_by: significance-editor
    asserted_at: '2026-10-01T13:17:58Z'
  - text: >-
      Check Lucas's digit conditions, the middle-prime lift from p to p²,
      the top-band residue count, and every PNT estimate at the fixed
      proportional endpoints used in the construction.
    location: Paper §§2–3; Arithmetic/ and Analytic/PNT.lean
    basis: editorial_inference
    asserted_by: significance-editor
    asserted_at: '2026-10-01T13:17:58Z'
  - text: >-
      The README reports two upstream Wiener sorry warnings outside the
      used dependency closure. An independent replay must inspect the actual
      final-theorem axiom report and confirm that dependency boundary.
    location: verify.sh; AxiomAudit.lean; pinned PrimeNumberTheoremAnd dependency
    basis: editorial_inference
    asserted_by: significance-editor
    asserted_at: '2026-10-01T13:17:58Z'
  prerequisites:
  - text: >-
      Elementary number theory, Lucas's theorem, the prime number theorem at
      fixed rescalings, inclusion–exclusion, the Chinese remainder theorem,
      and Lean dependency/axiom auditing for the formal checks.
    basis: editorial_inference
    asserted_by: significance-editor
    asserted_at: '2026-10-01T13:17:58Z'
