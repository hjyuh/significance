claim:
  id: claim-main
  text:
    value: >-
      The paper claims that for every sufficiently large integer k there is
      an integer n with k + 1 < n < L_k = lcm(1,...,k) such that no prime
      p <= k divides binom(n,k). Consequently g(k) < L_k eventually.
    basis: source_quote
    asserted_by: significance-editor
    asserted_at: '2026-10-01T13:17:58Z'
    locator:
      url: https://github.com/ethn-y/erdos-1095-lean/blob/e06b3e658c486b4aa16d0dcf738370fcd84fcd5c/paper/main.tex
      section: Theorem 1.1 (thm:main)
  display_math: '\exists K\ge 2\;\forall k\ge K,\quad g(k)<L_k=\operatorname{lcm}(1,\ldots,k)'
  scope:
    value: >-
      Partial relative to Erdős #1095: the eventual strict lcm bound only.
      The sharp growth estimate for log g(k), successive-ratio conjectures,
      and a numerical eventual threshold are outside the submitted scope.
    basis: editorial_inference
    asserted_by: significance-editor
    asserted_at: '2026-10-01T13:17:58Z'
    locator:
      url: https://github.com/ethn-y/erdos-1095-lean/blob/e06b3e658c486b4aa16d0dcf738370fcd84fcd5c/README.md
      section: Scope
