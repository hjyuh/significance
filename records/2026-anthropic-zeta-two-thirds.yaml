open_invitations:
  - kind: reproduction
    target: >-
      Independently build the Theorem D Lean targets and run their axiom audit
      at commit 3635e74826a4c1fcece7d1cd2b6fa75e43a00510.
    how: >-
      Clone https://github.com/anthropics/zeta-23-lean, check out
      3635e74826a4c1fcece7d1cd2b6fa75e43a00510, and retain the pinned
      lean-toolchain and lake-manifest.json. Run lake exe cache get, lake build
      Solution Solution.Multiplicity, then lake env lean
      comparator/PrintAxioms.lean and lake env lean
      comparator/PrintAxioms/Multiplicity.lean. Report commands, platform,
      exit codes, and the SHA-256 of the complete log.
    effort_estimate: "about 60–90 minutes with the repository cache; longer if dependencies must build from source"
    prerequisites:
      - "Lean command-line use and the pinned repository toolchain"
    respond:
      url: "https://github.com/hjyuh/significance/issues/new?template=invitation-response.yml"
    created_by: significance-editor
    created_at: "2026-08-11T00:48:19Z"
  - kind: correspondence
    target: >-
      Compare paper Theorem D with the trusted comparator statement
      montgomery_taylor_on_critical_line and its counting definitions.
    how: >-
      Use page 21 of the paper with SHA-256
      6792988e6cd0e17690621ce898abd5d534f98407741bc7cb14bbe7d07c77d72f.
      At the pinned repository commit, inspect comparator/ChallengeDeps.lean,
      comparator/Challenge.lean, comparator/Solution.lean, and config.json.
      State whether the interval conventions, multiplicity, critical-line
      count, limit formulation, and constant match; identify every mismatch
