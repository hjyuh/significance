digestions:
  - audience: non_specialist
    kind: plain_language
    stratum: editor
    text: >-
      The Riemann hypothesis predicts that every nontrivial zero of the zeta
      function lies on one vertical line. This paper does not establish that.
      It gives a lower-bound certificate: as higher and higher windows are
      examined, the claimed share of distinct zeros on that line is at least
      about 67.25%, after zeros are counted with multiplicity in the
      denominator. The other roughly one third are not claimed to lie off the
      line; this method simply does not account for them.
    basis: digest
    asserted_by: significance-editor
    source_claims: [claim-main]
  - audience: general_mathematician
    text: >-
      The paper replaces the positivity normally supplied by RH in
      Montgomery's pair-correlation argument with finite-dimensional linear
      algebra on a compression of Weil's Hermitian form. Theorem D optimizes
      the test window to obtain the Montgomery–Taylor constant 0.67250… . This
      is the paper's stated mechanism, not an assessment of its steps.
    basis: editorial_inference
    asserted_by: significance-editor
    locator:
      page: 1
      quote: >-
        The Riemann hypothesis … is replaced by linear algebra applied to a
        finite compression of Weil's Hermitian form.
    source_claims: [claim-main]

