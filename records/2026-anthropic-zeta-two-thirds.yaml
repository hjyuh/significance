      Work from the paper hash recorded here and name that hash in the report.
      Focus on the off-critical-line block decomposition, tail control, and
      use of the unconditional prime-side second moment. Name the first step
      you cannot justify, or state the bounded portion you checked; do not give
      a paper-wide score.
    effort_estimate: "about 3–5 hours"
    prerequisites:
