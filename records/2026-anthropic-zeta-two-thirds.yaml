    Claude's paper says at least about 67.25% of the nontrivial zeros of the
    Riemann zeta function are on the critical line, in a precise asymptotic
    sense. It does not claim to settle the Riemann hypothesis.
  checked: >-
    Significance pinned and inspected Anthropic's paper, concise note, and
    Lean repository. The paper and note were downloaded and hashed; the
    repository was pinned to its public v1.0 commit.
  not_checked: >-
    Significance has not independently rebuilt the Lean project, run
    comparator, matched every formal definition to the paper, or assessed the
    analytic argument. Anthropic reports human examination and successful
    formal checks; those reports are not independent Significance receipts.
  basis: digest
  asserted_by: significance-editor
  asserted_at: "2026-08-11T00:48:19Z"

