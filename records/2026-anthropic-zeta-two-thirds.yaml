claim:
  id: claim-main
  display_math: >-
    \liminf_{T \to \infty}
    \frac{N_0^*(T, 2T)}{N(T, 2T)}
    \ge \frac{3}{2} - \frac{1}{\sqrt{2}}
    \cot\!\left(\frac{1}{\sqrt{2}}\right)
    = 0.67250\ldots
  text:
    value: >-
      lim inf as T → ∞ of N₀*(T, 2T) / N(T, 2T) ≥
      3/2 − (1/√2) cot(1/√2) = 0.67250… .
    basis: source_quote
    asserted_by: claude-paper
    asserted_at: "2026-08-10T17:03:29Z"
    locator:
      page: 21
      quote: >-
        Theorem D. lim inf N₀*(T, 2T)/N(T, 2T) ≥
        3/2 − 1/√2 cot(1/√2) = 0.67250…
  scope:
    value: >-
      N(T, 2T) counts nontrivial zeros of the Riemann zeta function in the
      height window with multiplicity; N₀*(T, 2T) counts distinct such zeros
      on the critical line. The displayed result is an asymptotic lower bound,
      not a statement about every finite height window.
    basis: editorial_inference
    asserted_by: significance-editor
    asserted_at: "2026-08-10T17:03:29Z"
    locator:
      page: 1
      quote: >-
        Let N(T, 2T) denote the number of zeros … counted with multiplicity,
        and N₀*(T, 2T) the number of distinct such zeros with β = 1/2.
  exclusions:
    - value: >-
        They have no bearing on the Riemann hypothesis in either direction.
        The argument produces lower bounds only: it certifies that at least
        two thirds of the zeros are on the line, and says nothing about the
        remaining third.
      basis: source_quote
      asserted_by: claude-paper
      asserted_at: "2026-08-10T17:03:29Z"
      locator:
        page: 5
        quote: >-
          They have no bearing on the Riemann hypothesis in either direction.
          The argument produces lower bounds only.

plain_summary:
