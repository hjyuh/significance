  asserted_at: '2026-09-08T14:30:26Z'
  locator:
    url: https://www.erdosproblems.com/1212
    quote: >-
      Let $G$ be the graph with vertex set those pairs $(x,y)\in \mathbb{N}^2$ with $\mathrm{gcd}(x,y)=1$,
      in which we join two vertices if the differ in only one coordinate, and there by $\pm 1$. Is
      there a path going to infinity on $G$, say $P$, such that for all $(x,y)\in P$ both $\min(x,y)>1$
      and at least one of $x$ or $y$ is composite?
claim:
  id: claim-main
  text:
    value: >-
      We prove that this graph contains an infinite simple path, answering Erdős Problem 1212 affirmatively.
      More precisely, for almost every slope in a fixed interval away from the diagonal, there is
      a ray with that limiting coordinate ratio.
    basis: source_quote
    asserted_by: significance-editor
    asserted_at: '2026-09-08T14:30:26Z'
    locator:
      url: 
        https://raw.githubusercontent.com/crabsatellite/erdos-1212-visible-lattice-path/400001f0847afe36a26c588d34445210dbdc116e/paper/Li_Infinite_Paths_Composite_Restricted_Visible_Lattice_2026.pdf
      page: 1
      section: Abstract
      quote: We prove that this graph contains an infinite simple path, answering Erdős Problem 1212
        affirmatively. More precisely, for almost every slope in a fixed interval away from the 
        diagonal, there is a ray with that limiting coordinate ratio.
