claim:
  id: claim-main
  text:
    value: "Every 2-coloring of the edges of K_18 contains a monochromatic K_7 minus a perfect matching."
    basis: source_quote
    asserted_by: author-as
    asserted_at: "2026-06-01T12:00:00Z"
    locator:
      section: "1.1"
      quote: "Theorem 1.2. Every 2-colouring of E(K_18) admits a monochromatic K_7 minus a perfect matching."
  scope:
    value: "Applies to complete graphs on 18 or more vertices; the construction in Section 4 is specific to n = 18."
    basis: author_attestation
    asserted_by: author-as
    asserted_at: "2026-06-01T12:00:00Z"
  exclusions:
    - value: "Does not address the n = 17 boundary case, left open in Section 6."
      basis: source_quote
      asserted_by: author-as
      asserted_at: "2026-06-01T12:00:00Z"
