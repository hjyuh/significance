[project]
name = "significance"
version = "0.1.0"
description = "An open format and toolchain for attributable, version-bound, portable claim/evidence records for AI-assisted mathematics."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.12"
dependencies = [
    "jsonschema[format]>=4.23,<5",
    "ruamel.yaml>=0.18,<0.19",
    "jinja2>=3.1,<4",
    "markupsafe>=2.1,<3",
]

[project.scripts]
significance = "significance.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "ruff>=0.6,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["adapters/lean"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/significance"]
